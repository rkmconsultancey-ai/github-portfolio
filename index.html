<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Developer Portfolio Dashboard</title>
  <style>
    :root {
      --bg: #f6f8fa;
      --card: #ffffff;
      --border: #d0d7de;
      --text: #24292f;
      --muted: #57606a;
      --header: #24292f;
      --accent: #2188ff;
      --success: #2da44e;
      --warning: #d29922;
      --purple: #8250df;
      --blue-soft: #ddf4ff;
      --green-soft: #dafbe1;
      --orange-soft: #fff8c5;
      --danger: #cf222e;
    }

    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
    }

    .profile-header {
      background-color: var(--header);
      color: #ffffff;
      padding: 40px 20px;
      text-align: center;
      border-bottom: 1px solid var(--border);
    }

    .header-container {
      max-width: 800px;
      margin: 0 auto;
    }

    .avatar {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: 3px solid #57606a;
      margin-bottom: 16px;
      object-fit: cover;
      background: #fff;
    }

    .profile-header h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      font-weight: 600;
    }

    .bio {
      font-size: 16px;
      color: #8c959f;
      margin: 0 0 16px 0;
      line-height: 1.5;
    }

    .meta-info {
      font-size: 13px;
      color: #8c959f;
      margin-bottom: 20px;
    }

    .btn-profile {
      display: inline-block;
      padding: 8px 16px;
      background-color: var(--accent);
      color: white;
      text-decoration: none;
      font-weight: 500;
      border-radius: 6px;
      font-size: 14px;
    }

    .portfolio-container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    .dashboard-section {
      margin-bottom: 28px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
    }

    .dashboard-title {
      margin: 0 0 20px 0;
      font-size: 22px;
      font-weight: 600;
    }

    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 16px;
      margin-bottom: 18px;
    }

    .summary-card {
      background: linear-gradient(180deg, #ffffff 0%, #f6f8fa 100%);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 16px;
    }

    .summary-label {
      display: block;
      font-size: 12px;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 8px;
      font-weight: 600;
    }

    .summary-value {
      font-size: 28px;
      font-weight: 700;
    }

    .summary-value.green { color: var(--success); }
    .summary-value.orange { color: var(--warning); }
    .summary-value.blue { color: var(--accent); }
    .summary-value.purple { color: var(--purple); }

    .section-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border);
      padding-bottom: 12px;
    }

    .section-heading h2 {
      margin: 0;
      font-size: 20px;
      font-weight: 600;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap;
    }

    #repo-search {
      padding: 6px 12px;
      border: 1px solid var(--border);
      border-radius: 6px;
      width: 260px;
      font-size: 14px;
      outline: none;
    }

    .filter-group {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      padding: 6px 10px;
      border: 1px solid var(--border);
      border-radius: 999px;
      background: #fff;
      color: var(--muted);
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
    }

    .filter-btn.active {
      background: var(--blue-soft);
      border-color: rgba(33, 136, 255, 0.3);
      color: var(--accent);
    }

    .repos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
    }

    .repo-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 180px;
    }

    .repo-card h3 {
      margin: 0 0 10px;
      font-size: 18px;
    }

    .repo-card p {
      color: var(--muted);
      line-height: 1.5;
      margin: 0 0 16px;
      min-height: 42px;
    }

    .card-footer {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      font-size: 12px;
      color: var(--muted);
      margin-bottom: 12px;
    }

    .badge {
      background-color: #eaeef2;
      padding: 2px 8px;
      border-radius: 20px;
      font-weight: 500;
    }

    .badge-check {
      background-color: var(--green-soft);
      color: #1a7f37;
      border: 1px solid rgba(45, 164, 78, 0.2);
    }

    .badge-warn {
      background: var(--orange-soft);
      color: #9a6700;
      border: 1px solid rgba(210, 153, 34, 0.15);
    }

    .repo-link {
      font-size: 13px;
      color: #0969da;
      text-decoration: none;
      font-weight: 500;
    }

    .loading-text, .error-text, .empty-text {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px;
      color: var(--muted);
      font-style: italic;
    }

    .error-box {
      background: #fff8f8;
      border: 1px solid rgba(207, 34, 46, 0.2);
      color: var(--danger);
      border-radius: 10px;
      padding: 14px 16px;
      margin: 14px 0 20px;
      font-size: 14px;
    }

    @media (max-width: 640px) {
      .section-heading {
        align-items: flex-start;
      }

      #repo-search {
        width: 100%;
      }

      .toolbar {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <header class="profile-header">
    <div class="header-container">
      <img id="avatar" src="https://placeholder.com" alt="Profile" class="avatar">
      <h1 id="name">Loading Profile...</h1>
      <p id="bio" class="bio">Syncing dataset logs...</p>
      <div class="meta-info">
        <span id="location">📍 Remote Location</span> • <span id="followers">👥 0 Followers</span>
      </div>
      <a id="github-link" href="#" target="_blank" class="btn-profile">🌐 View Complete Profile</a>
    </div>
  </header>

  <main class="portfolio-container">
    <section class="dashboard-section">
      <h2 class="dashboard-title">📊 Live GitHub Dashboard</h2>
      <div class="summary-grid">
        <div class="summary-card">
          <span class="summary-label">Total Repos</span>
          <div id="total-repos" class="summary-value blue">0</div>
        </div>
        <div class="summary-card">
          <span class="summary-label">Verified Projects</span>
          <div id="verified-projects" class="summary-value green">0</div>
        </div>
        <div class="summary-card">
          <span class="summary-label">Learning / Sandbox</span>
          <div id="learning-projects" class="summary-value orange">0</div>
        </div>
        <div class="summary-card">
          <span class="summary-label">Portfolio / Apps</span>
          <div id="portfolio-projects" class="summary-value purple">0</div>
        </div>
      </div>
    </section>

    <div class="section-heading">
      <h2>📂 Verified Repositories</h2>
      <div class="toolbar">
        <div id="filter-group" class="filter-group" aria-label="Repository filters">
          <button class="filter-btn active" data-filter="all" type="button">All</button>
          <button class="filter-btn" data-filter="portfolio" type="button">Portfolio</button>
          <button class="filter-btn" data-filter="learning" type="button">Learning</button>
          <button class="filter-btn" data-filter="utility" type="button">Utilities</button>
        </div>
        <input type="text" id="repo-search" placeholder="Filter verified projects...">
      </div>
    </div>

    <div id="api-status" class="error-box" style="display:none"></div>
    <div id="repos-grid" class="repos-grid">
      <div class="loading-text">Analyzing root file definitions...</div>
    </div>
  </main>

  <script>
    const GITHUB_USERNAME = "rkmconsultancey-ai";
    const FALLBACK_REPOS = [
      { name: "github-portfolio", description: "Portfolio and dashboard for public GitHub repos.", language: "HTML", html_url: "https://github.com/rkmconsultancey-ai/github-portfolio" },
      { name: "gitfolio", description: "Minimal developer portfolio template built with Next.js and Tailwind CSS.", language: "JavaScript", html_url: "https://github.com/rkmconsultancey-ai/gitfolio" },
      { name: "chrome-url-launcher", description: "Launch chrome urls from a lightweight utility project.", language: "JavaScript", html_url: "https://github.com/rkmconsultancey-ai/chrome-url-launcher" },
      { name: "hello-world", description: "GitHub practice repo to learn the flow and basics.", language: null, html_url: "https://github.com/rkmconsultancey-ai/hello-world" },
      { name: "Best-Project-to-skill-up", description: "Learning project for improving web development skills.", language: null, html_url: "https://github.com/rkmconsultancey-ai/Best-Project-to-skill-up" },
      { name: "kilo-tutorial", description: "Tutorial project for building a text editor.", language: null, html_url: "https://github.com/rkmconsultancey-ai/kilo-tutorial" },
      { name: "rkm-node-app", description: "Node.js sandbox and learning project.", language: null, html_url: "https://github.com/rkmconsultancey-ai/rkm-node-app" },
      { name: "-rkm-node-app", description: "Node.js and gitignore sandbox for learning.", language: null, html_url: "https://github.com/rkmconsultancey-ai/-rkm-node-app" },
      { name: "advisory-database", description: "Security vulnerability reference and advisory database.", language: null, html_url: "https://github.com/rkmconsultancey-ai/advisory-database" },
      { name: "cli", description: "Developer tooling and CLI-related repo.", language: null, html_url: "https://github.com/rkmconsultancey-ai/cli" },
      { name: "help", description: "Support and issue tracking repository.", language: null, html_url: "https://github.com/rkmconsultancey-ai/help" },
      { name: "ledgervault-engine", description: "Bookmark organizer and utility project.", language: null, html_url: "https://github.com/rkmconsultancey-ai/ledgervault-engine" },
      { name: "docker-wps-office", description: "Containerized WPS Office project.", language: null, html_url: "https://github.com/rkmconsultancey-ai/docker-wps-office" },
      { name: "excel-registration-app", description: "Business app for registration or workflow tasks.", language: null, html_url: "https://github.com/rkmconsultancey-ai/excel-registration-app" }
    ];

    let GITHUB_TOKEN = sessionStorage.getItem("gh_token");
    let allRepos = [];
    let currentFilter = "all";

    if (!GITHUB_TOKEN) {
      GITHUB_TOKEN = prompt("Enter your GitHub Personal Access Token to bypass rate-limiting (optional):");
      if (GITHUB_TOKEN) sessionStorage.setItem("gh_token", GITHUB_TOKEN.trim());
    }

    document.addEventListener("DOMContentLoaded", () => {
      fetchProfile();
      fetchRepos();

      document.getElementById("repo-search").addEventListener("input", function (e) {
        const val = e.target.value.toLowerCase();
        renderRepos(filterRepos(allRepos, currentFilter, val));
      });

      document.querySelectorAll(".filter-btn").forEach(button => {
        button.addEventListener("click", () => {
          document.querySelectorAll(".filter-btn").forEach(item => item.classList.toggle("active", item === button));
          currentFilter = button.dataset.filter;
          renderRepos(filterRepos(allRepos, currentFilter, document.getElementById("repo-search").value.trim().toLowerCase()));
        });
      });
    });

    function getFetchOptions() {
      const headers = { Accept: "application/vnd.github+json" };
      if (GITHUB_TOKEN) headers["Authorization"] = `token ${GITHUB_TOKEN}`;
      return { headers };
    }

    function setApiStatus(message, isError = true) {
      const box = document.getElementById("api-status");
      if (!message) {
        box.style.display = "none";
        box.textContent = "";
        return;
      }

      box.style.display = "block";
      box.textContent = message;
      box.style.borderColor = isError ? "rgba(207, 34, 46, 0.2)" : "rgba(45, 164, 78, 0.2)";
      box.style.background = isError ? "#fff8f8" : "#f0fff4";
      box.style.color = isError ? "var(--danger)" : "var(--success)";
    }

    async function fetchProfile() {
      try {
        const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}`, getFetchOptions());
        const data = await res.json();

        if (!data || data.message) {
          throw new Error(data.message || "Profile request failed");
        }

        document.getElementById("avatar").src = data.avatar_url;
        document.getElementById("name").textContent = data.name || data.login;
        document.getElementById("bio").textContent = data.bio || "No biography details available.";
        document.getElementById("location").textContent = `📍 ${data.location || 'Remote'}`;
        document.getElementById("followers").textContent = `👥 ${data.followers} Followers`;
        document.getElementById("github-link").href = data.html_url;
      } catch (e) {
        console.error(e);
      }
    }

    function isVerifiedRepo(repo) {
      if (!repo || repo.fork || repo.archived || repo.private) return false;
      const name = (repo.name || "").trim();
      const description = (repo.description || "").trim();
      const language = repo.language || "";
      const hasMeaningfulMetadata = Boolean(name && (description || language || repo.has_readme !== false));
      return hasMeaningfulMetadata;
    }

    function classifyRepo(repo) {
      const name = (repo.name || "").toLowerCase();
      const description = (repo.description || "").toLowerCase();
      const text = `${name} ${description}`;

      if (name.includes("portfolio") || name.includes("gitfolio") || text.includes("portfolio")) return "portfolio";
      if (name.includes("hello") || name.includes("tutorial") || name.includes("learn") || name.includes("sandbox") || name.includes("node") || text.includes("learning") || text.includes("practice")) return "learning";
      if (name.includes("security") || name.includes("advisory") || name.includes("cve") || text.includes("security") || text.includes("vulnerability")) return "reference";
      if (name.includes("cli") || name.includes("tool") || name.includes("launcher") || name.includes("engine") || name.includes("app") || text.includes("utility")) return "utility";
      return "utility";
    }

    function renderFallbackState() {
      const repos = FALLBACK_REPOS.map(repo => ({
        ...repo,
        fork: false,
        archived: false,
        private: false,
        has_readme: true
      }));

      allRepos = repos.filter(isVerifiedRepo);
      const counts = buildCounts(allRepos);
      updateDashboardMetrics(counts, allRepos, true);
      renderRepos(filterRepos(allRepos, currentFilter, ""));
      setApiStatus("GitHub API request failed. Showing cached fallback data so the dashboard still works.", false);
    }

    function buildCounts(repos) {
      return {
        total: repos.length,
        verified: repos.length,
        learning: repos.filter(repo => classifyRepo(repo) === "learning").length,
        portfolio: repos.filter(repo => classifyRepo(repo) === "portfolio").length,
        utility: repos.filter(repo => classifyRepo(repo) === "utility").length
      };
    }

    async function fetchRepos() {
      const grid = document.getElementById("repos-grid");
      try {
        const res = await fetch(`https://api.github.com/users/${GITHUB_USERNAME}/repos?sort=updated&per_page=100`, getFetchOptions());
        const rawRepos = await res.json();

        if (!Array.isArray(rawRepos)) {
          throw new Error(rawRepos.message || "Repository request failed");
        }

        allRepos = rawRepos.filter(isVerifiedRepo);
        const counts = buildCounts(allRepos);
        updateDashboardMetrics(counts, allRepos, false);
        renderRepos(filterRepos(allRepos, currentFilter, ""));
        setApiStatus("", false);
      } catch (err) {
        console.error(err);
        grid.innerHTML = '<div class="error-text">Unable to load live GitHub repositories.</div>';
        renderFallbackState();
      }
    }

    function updateDashboardMetrics(counts, verifiedRepos, isFallback) {
      const totalRepos = counts.total || verifiedRepos.length || 0;
      const verifiedCount = counts.verified || verifiedRepos.length || 0;
      const learningCount = counts.learning || 0;
      const portfolioCount = counts.portfolio || 0;

      document.getElementById("total-repos").textContent = totalRepos;
      document.getElementById("verified-projects").textContent = verifiedCount;
      document.getElementById("learning-projects").textContent = learningCount;
      document.getElementById("portfolio-projects").textContent = portfolioCount;
    }

    function filterRepos(repos, filterName, searchText = "") {
      const normalizedSearch = searchText.toLowerCase();

      return repos.filter(repo => {
        const matchesFilter = filterName === "all" || classifyRepo(repo) === filterName;
        if (!matchesFilter) return false;

        if (!normalizedSearch) return true;

        const name = (repo.name || "").toLowerCase();
        const desc = (repo.description || "").toLowerCase();
        const lang = (repo.language || "").toLowerCase();
        return name.includes(normalizedSearch) || desc.includes(normalizedSearch) || lang.includes(normalizedSearch);
      });
    }

    function renderRepos(repos) {
      const grid = document.getElementById("repos-grid");
      grid.innerHTML = repos.length ? "" : '<div class="empty-text">No repos match the current filter.</div>';

      repos.forEach(repo => {
        const category = classifyRepo(repo);
        const badgeText = category === "portfolio" ? "Portfolio" : category === "learning" ? "Learning" : "Utility";
        const card = document.createElement("div");
        card.className = "repo-card";
        card.innerHTML = `
          <h3>📦 ${repo.name}</h3>
          <p>${repo.description || 'No context details provided.'}</p>
          <div class="card-footer">
            <span class="badge">${repo.language || 'Data Stream'}</span>
            <span class="badge ${category === 'learning' ? 'badge-warn' : 'badge-check'}">${badgeText}</span>
          </div>
          <a href="${repo.html_url}" target="_blank" class="repo-link">View Source Code →</a>
        `;
        grid.appendChild(card);
      });
    }
  </script>
</body>
</html>
